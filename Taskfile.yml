version: '3'

# Run from project root:
#   task debug:theme       — full tmux theme/status dump
#   task debug:theme-diff  — diff two consecutive dumps (dracula vs current)
#   task debug:tmuxp       — dump full tmux + tmuxp state for the current session
#                            (no args; session inferred from $TMUX)
#
# Dumps land under .context/tmux-theme-dump/ and .context/tmuxp-debug/ so
# Claude can read them back.

vars:
  DUMP_ROOT: '{{.ROOT_DIR}}/.context/tmux-theme-dump'
  TMUXP_DUMP_ROOT: '{{.ROOT_DIR}}/.context/tmuxp-debug'
  QEMU_EL2_LOG: '{{.ROOT_DIR}}/.context/debug/qemu/el2.log'
  VHE_DIR: '{{.ROOT_DIR}}/home/scripts/qemu/vhe'

tasks:
  switch:
    desc: Activate the nix-darwin configuration offline (no fresh nix cache)
    cmds:
      - sudo darwin-rebuild switch --flake . --offline
      - tmux source-file ~/.config/tmux/tmux.conf

  apply:
    desc: Build and activate with fresh nix cache (refresh flake inputs/substitutes)
    cmds:
      - sudo darwin-rebuild switch --flake . --refresh
      - tmux source-file ~/.config/tmux/tmux.conf

  prune:
    desc: Prune all unused Nix store derivations
    cmds:
      - nix-collect-garbage -d
      - nix store optimise

  colima:ssh:
    desc: SSH into the colima VM (home directory)
    dir: '~'
    cmds:
      - colima ssh

  colima:restart:
    desc: Restart colima VM (picks up new CPU/memory/disk settings)
    cmds:
      - colima stop
      - colima start --save-config=false

  debug:colima:
    desc: Debug colima VM state, nested virtualization, and /dev/kvm availability
    cmds:
      - |
        set -eu
        mkdir -p .context/debug
        LOG=.context/debug/colima.log
        : > "$LOG"
        run() { echo "$@" | tee -a "$LOG"; eval "$@" 2>&1 | tee -a "$LOG"; echo | tee -a "$LOG"; }
        log() { echo "$@" | tee -a "$LOG"; }
        log "=== Host ==="
        log "macOS version: $(sw_vers -productVersion 2>/dev/null || echo 'N/A')"
        log "Chip: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo 'N/A')"
        log "Rosetta installed: $(pgrep -q oahd && echo yes || echo no)"
        log ""

        log "=== Colima Status ==="
        colima status 2>&1 | tee -a "$LOG" || log "(colima not running)"
        log ""

        log "=== Colima Version ==="
        colima version 2>&1 | tee -a "$LOG"
        log ""

        log "=== Colima Config (default profile) ==="
        cat ~/.colima/default/colima.yaml 2>/dev/null | tee -a "$LOG" || log "(no config found)"
        log ""

        log "=== Lima VM Config ==="
        cat ~/.colima/_lima/default/lima.yaml 2>/dev/null | tee -a "$LOG" || log "(no lima config found)"
        log ""

        log "=== Lima VM Info ==="
        limactl list 2>/dev/null | tee -a "$LOG" || log "(limactl not found)"
        log ""

        log "=== VM: /dev/kvm check ==="
        colima ssh -- ls -la /dev/kvm 2>&1 | tee -a "$LOG" || log "/dev/kvm NOT available"
        log ""

        log "=== VM: CPU flags (vmx/svm) ==="
        colima ssh -- grep -cE '(vmx|svm)' /proc/cpuinfo 2>&1 | tee -a "$LOG" || log "(no vmx/svm flags)"
        log ""

        log "=== VM: kernel modules ==="
        colima ssh -- lsmod 2>&1 | grep -iE '(kvm|virt)' | tee -a "$LOG" || log "(no kvm/virt modules loaded)"
        log ""

        log "=== VM: kernel config KVM ==="
        colima ssh -- zgrep -i kvm /proc/config.gz 2>&1 | tee -a "$LOG" || colima ssh -- grep -ri kvm /boot/config-* 2>&1 | tee -a "$LOG" || log "(kernel config not available)"
        log ""

        log "=== VM: dmesg kvm/virt ==="
        colima ssh -- dmesg 2>&1 | grep -iE '(kvm|nested|virtuali)' | head -20 | tee -a "$LOG" || log "(no kvm/virt dmesg entries)"
        log ""

        log "=== VM: uname ==="
        colima ssh -- uname -a 2>&1 | tee -a "$LOG"
        log ""

        log "=== VM: /dev listing (virt-related) ==="
        colima ssh -- ls -la /dev/vhost* /dev/kvm /dev/vfio* 2>&1 | tee -a "$LOG" || log "(no virt devices)"
        log ""

        log "=== Nix Config (nestedVirtualization) ==="
        grep -n 'nestedVirtualization\|vmType\|rosetta' home/dmitry/default.nix 2>/dev/null | tee -a "$LOG" || log "(not found in config)"
        log ""

        # [H1] Where does home-manager write colima config vs where colima reads it?
        log "=== H1: Home-manager generated colima config files ==="
        log "-- Searching for colima YAML files managed by home-manager --"
        find ~/.config/colima -name '*.yaml' -o -name '*.yml' 2>/dev/null | while read f; do
          log "--- $f ---"
          cat "$f" 2>/dev/null | tee -a "$LOG"
          log ""
        done || log "(no files in ~/.config/colima)"
        log ""
        log "-- Searching XDG_CONFIG_HOME/colima --"
        log "XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-<unset>}"
        log ""
        log "-- Comparing colima config locations --"
        log "~/.colima/default/colima.yaml (colima reads this):"
        ls -la ~/.colima/default/colima.yaml 2>/dev/null | tee -a "$LOG" || log "(not found)"
        log "~/.config/colima/default/colima.yaml (XDG location):"
        ls -la ~/.config/colima/default/colima.yaml 2>/dev/null | tee -a "$LOG" || log "(not found)"
        log ""
        log "-- All colima-related files in ~/.config --"
        find ~/.config -path '*colima*' -type f 2>/dev/null | head -20 | tee -a "$LOG" || log "(none)"
        log ""

        # [H1] Check COLIMA_HOME env var
        log "=== H1: COLIMA_HOME env var ==="
        log "COLIMA_HOME=${COLIMA_HOME:-<unset>}"
        log ""

        # [H2] Check the launchd plist to see how home-manager starts colima
        log "=== H2: Launchd plist for colima service ==="
        PLIST=$(find ~/Library/LaunchAgents -name '*colima*' 2>/dev/null | head -1)
        if [ -n "$PLIST" ]; then
          log "--- $PLIST ---"
          cat "$PLIST" 2>/dev/null | tee -a "$LOG"
        else
          log "(no colima launchd plist found in ~/Library/LaunchAgents)"
        fi
        log ""
        log "-- All colima-related launchd plists --"
        find ~/Library/LaunchAgents -name '*colima*' 2>/dev/null | tee -a "$LOG" || log "(none)"
        log ""
        log "-- launchctl list | grep colima --"
        launchctl list 2>/dev/null | grep -i colima | tee -a "$LOG" || log "(no colima in launchctl)"
        log ""

        # [H2] Check if home-manager activation script does anything with colima
        log "=== H2: Home-manager colima activation ==="
        log "-- Nix store colima service scripts --"
        find /nix/store -maxdepth 2 -name '*colima*' -newer /nix/store/.nix-path-registration 2>/dev/null | head -20 | tee -a "$LOG" || log "(none found)"
        log ""

        # [H3] Diff nix settings vs actual colima.yaml
        log "=== H3: Settings diff (nix vs actual) ==="
        log "Nix wants: cpu=4 memory=8 disk=60 rosetta=true nestedVirtualization=true vmType=vz"
        log "Actual colima.yaml:"
        grep -E '^(cpu|memory|disk|rosetta|nestedVirtualization|vmType):' ~/.colima/default/colima.yaml 2>/dev/null | tee -a "$LOG" || log "(could not parse)"
        log ""

        # [H3] Check if home-manager wrote a colima template
        log "=== H3: Colima templates ==="
        log "-- ~/.colima/_templates/ --"
        ls -la ~/.colima/_templates/ 2>/dev/null | tee -a "$LOG" || log "(no templates dir)"
        cat ~/.colima/_templates/default.yaml 2>/dev/null | tee -a "$LOG" || log "(no default template)"
        log ""

        # [H1/H2] Check colima start command that would be used by service
        log "=== H1/H2: How home-manager starts colima ==="
        log "-- systemctl/launchd service status --"
        launchctl print gui/$(id -u) 2>/dev/null | grep -i colima | tee -a "$LOG" || log "(not found in launchctl print)"
        log ""

        log "=== DOCKER_HOST ==="
        log "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
        docker context ls 2>/dev/null | tee -a "$LOG" || log "(docker not found)"
        log ""

        log "=== Docker Info (server) ==="
        docker info 2>&1 | grep -iE '(server version|storage|runtime|cgroup|kernel|operating system|architecture)' | tee -a "$LOG" || log "(docker info failed)"
        log ""
        log "=== Log saved to $LOG ==="

  debug:theme:
    desc: Dump full tmux theme/status state (run from inside tmux)
    cmds:
      - |
        set -eu

        if [ -z "${TMUX:-}" ]; then
          echo "ERROR: not inside a tmux session — run this from inside tmux." >&2
          exit 1
        fi

        STAMP=$(date +%Y%m%dT%H%M%S)
        DEST="{{.DUMP_ROOT}}/$STAMP"
        LATEST="{{.DUMP_ROOT}}/latest"

        mkdir -p "$DEST"

        # ─── tmux + terminal identity ──────────────────────────────────────
        tmux -V                                     > "$DEST/01-tmux-version.txt"
        printf 'TERM=%s\nCOLORTERM=%s\nTERM_PROGRAM=%s\nTERM_PROGRAM_VERSION=%s\nLANG=%s\n' \
          "${TERM:-}" "${COLORTERM:-}" "${TERM_PROGRAM:-}" "${TERM_PROGRAM_VERSION:-}" "${LANG:-}" \
                                                    > "$DEST/02-env.txt"

        # ─── effective options (the ground truth) ──────────────────────────
        tmux show -g                                > "$DEST/10-server-options.txt"
        tmux show -gw                               > "$DEST/11-window-options.txt"

        # Status-slice — everything that paints the bar
        tmux show -g | grep -E '^(status|window-status|pane-border|message|mode|set-titles)' \
                                                    > "$DEST/12-status-slice.txt"

        # The 2-row format strings (one per line — tmux prints status-format[0] and [1])
        tmux show -g status-format                  > "$DEST/13-status-format.txt"

        # ─── rendered status (what user actually sees) ─────────────────────
        # The raw template (#() commands NOT expanded)
        tmux display -p '#{status-left}'            > "$DEST/20-status-left-raw.txt"
        tmux display -p '#{status-right}'           > "$DEST/21-status-right-raw.txt"

        # Warm tmux's internal #() cache before capturing the expanded
        # snapshot. `tmux display -p` evaluates `#()` ASYNCHRONOUSLY — the
        # first call queues the command and returns empty; the result lands
        # in cache only after the shell command completes. Without warming,
        # widgets wrapped in `#{?#{==:#(...),},,...}` collapse to empty in
        # the dump (looks broken in 23-status-right-expanded.txt), even
        # though the LIVE status bar paints them correctly because its
        # 5-second refresh cycle keeps the cache warm.
        # Strategy: extract every `#(cmd)` from the raw template, run each
        # once via `tmux display -p` to populate the server-side cache,
        # then sleep one status-interval before the real snapshot.
        while IFS= read -r cmd; do
          [ -z "$cmd" ] && continue
          tmux display -p "$cmd" >/dev/null 2>&1 || true
        done < <(grep -hoE '#\([^)]+\)' "$DEST/21-status-right-raw.txt" "$DEST/20-status-left-raw.txt" | sort -u)
        sleep 2

        # The expanded version (#() expanded, escapes resolved) — the bytes painted
        tmux display -p '#{T:status-left}'          > "$DEST/22-status-left-expanded.txt"
        tmux display -p '#{T:status-right}'         > "$DEST/23-status-right-expanded.txt"

        # ─── pane border / titles (likely source of dmitry@automationd) ────
        tmux show -gv pane-border-status            > "$DEST/30-pane-border-status.txt" || true
        tmux show -gv pane-border-format            > "$DEST/31-pane-border-format.txt" || true
        # Expand the pane-border-format for the current pane — shows literal painted bytes
        BORDER_FMT=$(tmux show -gv pane-border-format 2>/dev/null || true)
        if [ -n "$BORDER_FMT" ]; then
          tmux display -p "$BORDER_FMT"             > "$DEST/32-pane-border-rendered.txt"
        fi
        tmux display -p '#{pane_title}'             > "$DEST/33-pane-title.txt"
        tmux show -gv set-titles                    > "$DEST/34-set-titles.txt" || true
        tmux show -gv set-titles-string             > "$DEST/35-set-titles-string.txt" || true

        # ─── window list with titles/cmds (cross-reference) ────────────────
        tmux list-windows -a \
          -F '#{session_name}:#{window_index} name="#{window_name}" active=#{window_active} panes=#{window_panes}' \
                                                    > "$DEST/40-windows.txt"
        tmux list-panes -a \
          -F '#{session_name}:#{window_index}.#{pane_index} active=#{pane_active} title="#{pane_title}" cmd=#{pane_current_command} cwd=#{pane_current_path}' \
                                                    > "$DEST/41-panes.txt"
        tmux list-clients \
          -F 'client=#{client_name} tty=#{client_tty} term=#{client_termname} session=#{client_session} w=#{client_width} h=#{client_height}' \
                                                    > "$DEST/42-clients.txt"

        # ─── key bindings (mouse menus, etc.) ──────────────────────────────
        tmux list-keys                              > "$DEST/50-keys-all.txt"
        tmux list-keys -T root                      > "$DEST/51-keys-root.txt"
        tmux list-keys -T root | grep -E 'Mouse'    > "$DEST/52-keys-mouse.txt" || true

        # ─── generated tmux.conf (home-manager output) ─────────────────────
        if [ -f "$HOME/.config/tmux/tmux.conf" ]; then
          cp "$HOME/.config/tmux/tmux.conf"         "$DEST/60-generated-tmux.conf"
        fi

        # ─── nix-side resolved theme + plugin list ─────────────────────────
        # Snapshot what's in tree so the dump is self-contained
        cp {{.ROOT_DIR}}/home/programs/theme.nix    "$DEST/70-theme.nix"           2>/dev/null || true
        cp {{.ROOT_DIR}}/home/programs/tmux.nix     "$DEST/71-tmux.nix"            2>/dev/null || true
        cp {{.ROOT_DIR}}/home/programs/tmux/default.nix \
                                                    "$DEST/72-framework-default.nix" 2>/dev/null || true

        # Currently composed widget list — extract the literal composeBar lines
        grep -n 'composeBar' {{.ROOT_DIR}}/home/programs/tmux.nix \
                                                    > "$DEST/73-composed-widgets.txt" 2>/dev/null || true

        # ─── git context (which commit produced this dump) ─────────────────
        {
          echo "HEAD=$(cd {{.ROOT_DIR}} && git rev-parse HEAD 2>/dev/null)"
          echo "BRANCH=$(cd {{.ROOT_DIR}} && git rev-parse --abbrev-ref HEAD 2>/dev/null)"
          echo "DIRTY=$(cd {{.ROOT_DIR}} && git status --porcelain 2>/dev/null | wc -l) files"
        }                                           > "$DEST/80-git.txt"
        (cd {{.ROOT_DIR}} && git diff --stat HEAD -- home/programs/tmux.nix home/programs/theme.nix home/programs/tmux/) \
                                                    > "$DEST/81-theme-dirty.txt" 2>/dev/null || true

        # ─── tmux server-side plugin dir (TPM-installed plugins) ───────────
        ls -la "$HOME/.config/tmux/plugins" 2>/dev/null \
                                                    > "$DEST/90-plugins.txt" || true

        # ─── widget cache state (~/.cache/tmux-widget/*) ───────────────────
        # For each cache file: mtime + age + size + content + PUA scan. Tells
        # us:
        #   (1) when was each widget last refreshed
        #   (2) what bytes are currently cached
        #   (3) whether the cached content has PUA Nerd Font glyphs
        # Used by the CACHE/* checks in 99-checks.txt below.
        CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/tmux-widget"
        {
          echo "# Widget cache state at $(date -Iseconds)"
          echo "# Directory: $CACHE_DIR"
          echo
          if [ -d "$CACHE_DIR" ]; then
            for f in "$CACHE_DIR"/*; do
              [ -e "$f" ] || continue
              now=$(date +%s)
              mtime=$(date -r "$f" +%s 2>/dev/null || echo 0)
              age=$(( now - mtime ))
              echo "=== $(basename "$f") ==="
              echo "path:   $f"
              echo "mtime:  $(date -r "$f" '+%Y-%m-%dT%H:%M:%S%z')"
              echo "age:    ${age}s ($(( age / 60 ))m $(( age % 60 ))s)"
              echo "size:   $(wc -c < "$f") bytes"
              printf 'content (raw):   '; cat  "$f"; echo
              printf 'content (hex):   '; xxd "$f" | head -3
              echo
            done
          else
            echo "(no widget cache directory yet)"
          fi
        }                                            > "$DEST/97-widget-cache.txt"

        # ─── automated checks (one assertion per known regression) ─────────
        # Captures whether each .context/tasks/todo/<ticket>.md issue is
        # currently present, so the dump self-diagnoses without me eyeballing
        # raw config files. PASS = fix landed, FAIL = regression present,
        # INFO = data point worth noting but not a strict pass/fail.
        python3 - "$DEST" <<'PYEOF' > "$DEST/99-checks.txt"
        import re, sys, pathlib, unicodedata

        dest = pathlib.Path(sys.argv[1])
        def read(name):
            p = dest / name
            return p.read_text() if p.exists() else ""

        slice_txt  = read("12-status-slice.txt")
        fmt_txt    = read("13-status-format.txt")
        winopt_txt = read("11-window-options.txt")
        right_raw  = read("21-status-right-raw.txt")
        right_exp  = read("23-status-right-expanded.txt")
        left_exp   = read("22-status-left-expanded.txt")

        results = []
        def check(name, ok, detail=""):
            results.append(("PASS" if ok else "FAIL", name, detail))
        def info(name, detail=""):
            results.append(("INFO", name, detail))

        # Ticket 1: snapshotTick at end of status-right
        check("T1 snapshotTick present in status-right",
              "tmux-snapshot-tick" in slice_txt,
              "expected `#(.../tmux-snapshot-tick)` somewhere in status-right")

        # Ticket 2: message-style not tmux default
        m = re.search(r'^message-style\s+(\S.*)$', slice_txt, re.M)
        ms = m.group(1).strip('"') if m else "<missing>"
        check("T2 message-style not tmux default yellow/black",
              "yellow" not in ms and "fg=black" not in ms,
              f"got: {ms}")

        # Ticket 3a: status-format[1] uses #{E:...} not #{T;=/...}
        check("T3a status-format[1] no truncation directive",
              "#{T;=/#{status-right-length}:status-right}" not in fmt_txt,
              "found tmux-3.0-only #{T;=/...:status-right} directive — mangles on old tmux/thin clients")

        # Ticket 3b: status-right-length <= 100
        m = re.search(r'^status-right-length\s+(\d+)', slice_txt, re.M)
        srl = int(m.group(1)) if m else -1
        check("T3b status-right-length <= 100",
              0 < srl <= 100,
              f"got: {srl} (was 300 in framework regression)")

        # Ticket 3c/d: window-status activity/bell style = bold (not reverse)
        for kind in ("activity", "bell"):
            m = re.search(rf'^window-status-{kind}-style\s+(\S+)', winopt_txt, re.M)
            v = m.group(1) if m else "<missing>"
            check(f"T3c/d window-status-{kind}-style = bold",
                  v == "bold",
                  f"got: {v} (reverse causes flicker on thin SSH clients)")

        # Ticket 3e: window-status-format uses compact #{window_flags}, not per-flag conditionals
        check("T3e window-status-format uses compact #{window_flags}",
              "window_zoomed_flag" not in winopt_txt and "window_bell_flag" not in winopt_txt,
              "found per-flag #{?window_*_flag,...} conditionals — adds escape noise")

        # Ticket 4a: status-style bg not the framework-divergent #373844
        m = re.search(r'^status-style\s+"?bg=(#[0-9A-Fa-f]+)', slice_txt, re.M)
        sb = m.group(1).lower() if m else "<missing>"
        check("T4a status-style bg matches Dracula upstream",
              sb == "#44475a",
              f"got: {sb} (Dracula upstream uses #44475a; #373844 was the framework regression)")

        # Ticket 4b: time block bg distinct from window bg (uses #6272A4)
        check("T4b time block bg = #6272A4 (distinct from window-status bg #44475A)",
              "#6272A4" in right_raw or "#6272a4" in right_raw,
              "expected `bg=#6272A4` near the %R %Z fragment")

        # Ticket 5a: snapshotTick output empty (status-right should not end with literal text)
        snapshot_trailing = right_exp.rstrip("\n").split("snapshot-tick")
        if len(snapshot_trailing) >= 2:
            after = snapshot_trailing[-1].lstrip(")")[:20]
            check("T5/secret-newline: snapshotTick emits empty output",
                  after.strip() == "" or after.strip().startswith("\n") == False,
                  f"trailing bytes after snapshot-tick: {after!r}")
        else:
            info("snapshotTick output empty — could not locate in expanded status-right")

        # Ticket 5b: no embedded newlines in rendered status (would break the 2-row layout)
        for name, content in [("status-left", left_exp), ("status-right", right_exp)]:
            lines = content.rstrip("\n").count("\n")
            check(f"T5/secret-newline: rendered {name} has no embedded newlines",
                  lines == 0,
                  f"got: {lines} embedded newlines in expanded output")

        # Ticket 5c: PUA (Private Use Area) glyphs in rendered status when nerdFonts=false
        def find_pua(s):
            out = []
            for i, ch in enumerate(s):
                cp = ord(ch)
                if 0xE000 <= cp <= 0xF8FF or 0xF0000 <= cp <= 0xFFFFD:
                    out.append((i, ch, f"U+{cp:04X}"))
            return out

        # Two-tier check:
        #   1. Static check on what was painted at dump time (catches glyphs
        #      that happened to be rendered right then).
        #   2. Active check: extract every #(…) command from status-right-raw
        #      and EXECUTE it directly to catch glyphs that only appear when
        #      the widget's cache is warm / shell-out succeeds. This catches
        #      the "I see a cloud icon sometimes" timing-dependent symptom.
        nerd_in_left  = find_pua(left_exp)
        nerd_in_right = find_pua(right_exp)
        nerd_total = len(nerd_in_left) + len(nerd_in_right)
        theme_nix = read("70-theme.nix")
        # Determine the EFFECTIVE nerdFonts setting. theme.nix has a default
        # (`nerdFonts ? false|true`), but the consumer in `home/programs/tmux.nix`
        # may override it with an explicit positional arg `nerdFonts = …;` in
        # the `import ./theme.nix { … }` call. Caller wins.
        src_tmux_nix_for_nf = read("71-tmux.nix")
        override_match = re.search(
            r"import\s+\./theme\.nix\s*\{[^}]*\bnerdFonts\s*=\s*(true|false)\s*[;}]",
            src_tmux_nix_for_nf, re.S)
        if override_match:
            nerdfonts_off = override_match.group(1) == "false"
        else:
            nerdfonts_off = re.search(r'nerdFonts\s*\?\s*false', theme_nix) is not None

        if nerdfonts_off:
            check("T5/nerdFont (static): no PUA glyphs in rendered status at dump time",
                  nerd_total == 0,
                  f"found {nerd_total} PUA glyph(s): left={nerd_in_left[:3]} right={nerd_in_right[:3]}")
        else:
            info(f"nerdFonts=true: PUA glyphs in rendered status: {nerd_total}",
                 f"left={nerd_in_left[:3]} right={nerd_in_right[:3]}")

        # Active widget-script execution check. Also dumps each widget's
        # verbatim stdout to 98-widget-outputs.txt so we can directly inspect
        # what's actually being painted (independent of the status-bar dump
        # timing). Catches glyphs/newlines that only appear when the widget
        # has actual content to emit.
        import subprocess
        widget_cmds = re.findall(r'#\((/nix/store/[^)]+)\)', right_raw + read("20-status-left-raw.txt"))
        widget_outputs_path = dest / "98-widget-outputs.txt"
        with widget_outputs_path.open("w") as wf:
            wf.write(f"# Verbatim stdout of each #() command in status-left/right at check time.\n")
            wf.write(f"# Used to spot PUA glyphs, embedded newlines, raw ANSI sequences.\n\n")
            for cmd_path in widget_cmds:
                widget_name = cmd_path.split('/')[-1]
                try:
                    proc = subprocess.run(cmd_path.split(), capture_output=True, timeout=8, text=True)
                    stdout = proc.stdout
                except Exception as e:
                    info(f"T5/widget-exec: could not execute {widget_name}", str(e))
                    wf.write(f"=== {widget_name} (EXEC FAILED) ===\n{e}\n\n")
                    continue
                wf.write(f"=== {widget_name} ===\n")
                wf.write(f"length: {len(stdout)} bytes; lines: {stdout.count(chr(10)) + 1}\n")
                wf.write(f"repr:   {stdout!r}\n")
                wf.write(f"raw:    {stdout}\n")
                non_ascii = [(i, ch, f"U+{ord(ch):04X}") for i, ch in enumerate(stdout) if ord(ch) > 127]
                if non_ascii:
                    wf.write(f"non-ASCII chars: {non_ascii[:20]}\n")
                wf.write("\n")
                pua_hits = find_pua(stdout)
                if nerdfonts_off:
                    check(f"T5/nerdFont (active): {widget_name} emits no PUA glyphs",
                          len(pua_hits) == 0,
                          f"found {len(pua_hits)} PUA glyph(s) at {pua_hits[:3]} in stdout={stdout[:80]!r}")
                # Embedded newlines/CR/BEL break the 2-row layout — flag any
                content_lines = stdout.rstrip("\n").count("\n")
                cr_count     = stdout.count("\r")
                bel_count    = stdout.count("\a")
                check(f"T5/secret-newline (active): {widget_name} output is single-line",
                      content_lines == 0 and cr_count == 0 and bel_count == 0,
                      f"newlines={content_lines} cr={cr_count} bel={bel_count} stdout={stdout[:80]!r}")
                # Raw ANSI escape leak (bare \x1b not wrapped in tmux #[...])
                raw_ansi = stdout.count("\x1b")
                check(f"T5/raw-ansi (active): {widget_name} emits no raw \\x1b escape codes",
                      raw_ansi == 0,
                      f"found {raw_ansi} raw ESC bytes — tmux can't account for their width, breaks status row geometry")

        # pane-border-format: ensure it doesn't leak shell-set pane_title
        # (Midnight Commander injects "mc [user@host]:cwd" — visible regression)
        pbf_path = read("31-pane-border-format.txt").strip()
        check("pane-border-format: no #{pane_title} (leaks user@host via mc)",
              "#{pane_title}" not in pbf_path,
              f"got: {pbf_path}")

        # ─── Glyph WIDTH diagnostics — debug "extra newline on Termius" ────
        # Background: Nerd Font icons live in the Private Use Area. By Unicode
        # spec they have wcwidth()=1, but Nerd Fonts render them as 2-cell
        # icons. tmux uses wcwidth() for its column math → status-right is N
        # columns wide internally but renders as N+K cells visually. On a
        # narrow client (Termius mobile, 50–70 cols) the overflow wraps to a
        # phantom row → "infinite bars" / "secret newline" symptom.
        #
        # Report: tmux's reported widget length vs Python's char count vs
        # likely-rendered cells (PUA chars counted as 2 per Nerd Font convention).
        widget_outputs_text = widget_outputs_path.read_text()
        # Parse the widget_outputs file: each "raw:    <content>" line per widget
        for block in re.split(r"^=== ", widget_outputs_text, flags=re.M):
            m_name = re.match(r"(\S+) ===", block)
            m_raw  = re.search(r"^raw:\s+(.*)$", block, re.M)
            if not (m_name and m_raw):
                continue
            wname = m_name.group(1)
            raw = m_raw.group(1).rstrip()
            if not raw:
                continue
            char_count = len(raw)
            pua_chars  = [c for c in raw if 0xE000 <= ord(c) <= 0xF8FF
                                          or 0xF0000 <= ord(c) <= 0xFFFFD]
            # Likely-rendered cells: ASCII=1, PUA=2 (Nerd Font icon convention)
            # Standard wide chars (E.A.W "W"/"F") would also be 2 but we don't
            # detect those here; weather widget uses BMP+PUA only.
            likely_cells = sum(2 if (0xE000 <= ord(c) <= 0xF8FF or
                                     0xF0000 <= ord(c) <= 0xFFFFD) else 1
                               for c in raw)
            if pua_chars:
                drift = likely_cells - char_count
                info(f"WIDTH/{wname}: PUA glyph width drift = +{drift} cells",
                     f"content={raw!r} python_chars={char_count} "
                     f"pua_chars={len(pua_chars)} likely_terminal_cells={likely_cells} — "
                     f"tmux counts {char_count} cols but Termius/Nerd-Font renders {likely_cells} → "
                     f"overflow risk on narrow clients (status-right-length={srl})")

        # Bonus: what does tmux itself think the rendered status-right width is?
        # tmux's `#{n:format}` returns length after expansion; comparing to
        # client_width tells us if we're already pushing the bar's limits.
        try:
            n_right = subprocess.check_output(
                ["tmux", "display", "-p", "#{n:#{T:status-right}}"],
                stderr=subprocess.DEVNULL).decode().strip()
            cwidth  = subprocess.check_output(
                ["tmux", "display", "-p", "#{client_width}"],
                stderr=subprocess.DEVNULL).decode().strip()
            info(f"WIDTH/status-right: tmux-reported length vs client width",
                 f"tmux says status-right = {n_right} cols; client width = {cwidth} cols")
        except Exception:
            pass

        # Ticket 5d: empty-widget escape leaks (rendered now-playing block when no music)
        # Heuristic: status-right contains a `#[fg=...]#[fg=...]#[default]` triple
        # with no content between escapes — sign of empty #() with no skipWhenEmpty wrapper
        empty_escape_pattern = re.compile(r'#\[fg=#[0-9A-Fa-f]+\]#\[fg=#[0-9A-Fa-f]+,?bg?=?[#A-Fa-f0-9]*\]\s*#\[default\]')
        leaks = empty_escape_pattern.findall(right_exp)
        check("T5/empty-widget: no stray color escapes from empty widgets",
              len(leaks) == 0,
              f"found {len(leaks)} suspicious empty-content escape sequence(s) in rendered status-right")

        # ─── CONFIG DRIFT: source → generated → live three-way diff ────────
        # Catches the most common "my edits aren't applied" frustration:
        #   layer 1: source tmux.nix (your edits)
        #   layer 2: generated ~/.config/tmux/tmux.conf (after darwin-rebuild switch)
        #   layer 3: live `tmux show -g` (after tmux kill-server reload)
        # When these disagree, the dump previously showed PASS for unrelated
        # checks but the user STILL saw the broken state on screen.
        src_tmux_nix = read("71-tmux.nix")  # captured by the dump
        gen_conf     = read("60-generated-tmux.conf")
        live_sright  = ""
        m = re.search(r'^status-right\s+"(.*)"\s*$', slice_txt, re.M)
        if m:
            live_sright = m.group(1)

        # Extract the source-level composeBar widget list, e.g. `[ "date-time" ]`
        # Anchor at line start and reject leading `#` so commented-out reference
        # lines (`#   set -g status-right …`) don't shadow the live setting.
        m = re.search(
            r"^[ \t]*set -g status-right\s+'\$\{framework\.composeBar\s*\[\s*([^]]+)\]\s*\}'",
            src_tmux_nix, re.M)
        src_widgets = re.findall(r'"([^"]+)"', m.group(1)) if m else []

        # Extract generated status-right line (the literal one tmux loads)
        gen_sright = ""
        for line in gen_conf.splitlines():
            stripped = line.lstrip()
            if stripped.startswith("set -g status-right '"):
                gen_sright = stripped
                break

        # Look up each candidate widget in the generated string to see which
        # are actually present. Names map roughly to `tmux-widget-<name>` paths.
        all_widget_names = ["session", "now-playing", "weather", "date-time",
                            "host", "user", "cpu", "ram", "battery", "git",
                            "kubernetes", "network", "uptime", "application",
                            "directory", "attached-clients"]
        def widget_in(s, w):
            # Looser match — `tmux-widget-now-playing` for shell widgets, or
            # literal text fragment (e.g. `%R %Z` for date-time).
            if w == "date-time":
                return "%R %Z" in s or "date-time" in s
            return f"tmux-widget-{w}" in s

        gen_widgets  = [w for w in all_widget_names if widget_in(gen_sright,  w)]
        live_widgets = [w for w in all_widget_names if widget_in(live_sright, w)]

        # Layer 1→2: source matches generated tmux.conf
        # If the source composeBar list is non-empty and we extracted gen_widgets,
        # they should match. Mismatch → rebuild didn't apply.
        if src_widgets:
            check("CONFIG/source→generated: tmux.nix composeBar matches ~/.config/tmux/tmux.conf",
                  set(src_widgets) == set(gen_widgets),
                  f"source={src_widgets} generated={gen_widgets} — run `sudo darwin-rebuild switch --flake .` and check for errors")
        else:
            info("CONFIG/source→generated: could not parse source composeBar list — skipping")

        # Layer 2→3: generated matches live tmux server state
        # If gen_widgets != live_widgets, tmux server didn't reload.
        if gen_widgets or live_widgets:
            check("CONFIG/generated→live: generated tmux.conf matches live tmux server",
                  gen_widgets == live_widgets,
                  f"generated={gen_widgets} live={live_widgets} — run `tmux kill-server` from OUTSIDE tmux to reload")

        # Bonus diagnostic: dirty source files that differ from HEAD
        dirty = read("81-theme-dirty.txt").strip()
        if dirty:
            info("CONFIG/source-dirty: uncommitted edits present (may or may not be in the active generation)",
                 dirty.replace("\n", " | ")[:200])

        # ─── CACHE STATE: ~/.cache/tmux-widget/* introspection ─────────────
        # Three concrete questions per cache file:
        #   (1) when was it last pulled (mtime / age)
        #   (2) does it contain PUA Nerd Font glyphs (the regression)
        #   (3) is its content what tmux currently paints (cache ≡ live)
        import os, time
        cache_dir = pathlib.Path(os.environ.get("XDG_CACHE_HOME",
                                                pathlib.Path.home() / ".cache")) / "tmux-widget"
        if cache_dir.is_dir():
            now = int(time.time())
            # Group cache files by widget prefix (e.g. "tmux-widget-weather")
            # so we can identify which cache is ACTIVE for each widget. The
            # hash-keyed naming (`_cache.nix` content-key) means every rebuild
            # produces a new filename — old caches linger as orphans. The
            # newest mtime per prefix is the one the current build's wrapper
            # is writing to; older ones are harmless leftovers.
            groups = {}
            for cf in cache_dir.iterdir():
                if not cf.is_file():
                    continue
                prefix = cf.name.rsplit("-", 1)[0]  # strip trailing "-<hash>"
                groups.setdefault(prefix, []).append(cf)
            active_caches = set()
            for prefix, files in groups.items():
                files.sort(key=lambda f: f.stat().st_mtime, reverse=True)
                active_caches.add(files[0].name)   # newest mtime = active
            for cf in sorted(cache_dir.iterdir()):
                if not cf.is_file():
                    continue
                content = cf.read_text(errors="replace")
                age_s = now - int(cf.stat().st_mtime)
                age_h = f"{age_s // 60}m{age_s % 60}s"
                is_active = cf.name in active_caches
                tag = "active" if is_active else "ORPHAN"

                # (1) when was it pulled
                info(f"CACHE/{cf.name} ({tag}): last refresh {age_h} ago",
                     f"mtime={time.strftime('%Y-%m-%dT%H:%M:%S', time.localtime(cf.stat().st_mtime))} "
                     f"size={len(content)}B content={content!r}")

                # Orphans get only the info line — they're not in the active
                # build's wrapper, so PUA glyphs / live-mismatch are by design.
                # Suggest cleanup once at the end (below).
                if not is_active:
                    continue

                # (2) does cache contain a PUA glyph (active caches only)
                pua_hits = find_pua(content)
                check(f"CACHE/{cf.name}: no PUA glyphs in cached content",
                      len(pua_hits) == 0,
                      f"cache has {len(pua_hits)} PUA glyph(s) at {pua_hits[:3]} — "
                      f"rebuild changed the script source but cache_file path didn't change. "
                      f"Manual unblock: rm {cf}")

                # (3) is what tmux paints == what's in the cache? (active caches only)
                trimmed = content.rstrip()
                if trimmed:
                    in_live = trimmed in right_exp.rstrip()
                    widget_in_status = any(
                        cf.name.startswith(w) for w in
                        ("tmux-widget-weather", "tmux-widget-now-playing",
                         "tmux-widget-git", "tmux-widget-kubernetes",
                         "tmux-widget-network", "tmux-widget-battery")
                        if w in right_raw or w in left_exp
                    )
                    if widget_in_status:
                        # First-write race: if cache was just created (age < 10s),
                        # the dump's `tmux display -p '#{T:status-right}'` likely
                        # ran BEFORE the background fetch finished writing the
                        # cache file. The very next status-interval tick paints it.
                        if not in_live and age_s < 10:
                            info(f"CACHE/{cf.name}: cached content not yet in live status-right (first-write race)",
                                 f"cache freshly written {age_s}s ago — dump caught the cache between "
                                 f"first call (returned empty) and bg-fetch completion. Re-run dump in ~5s to confirm.")
                        else:
                            check(f"CACHE/{cf.name}: cached content appears in live status-right",
                                  in_live,
                                  f"cache={trimmed!r:.80s} but not found in rendered status — "
                                  f"either tmux is reading a different cache key, or the widget "
                                  f"isn't actually composed into status-right")
                    else:
                        info(f"CACHE/{cf.name}: widget not currently in status-right (cache orphaned but harmless)",
                             f"cached content {trimmed!r:.80s} — leftover from a previous build/config")
            # Suggest cleanup if there are orphans accumulating
            orphan_files = [cf for cf in cache_dir.iterdir()
                            if cf.is_file() and cf.name not in active_caches]
            if orphan_files:
                info(f"CACHE/orphans: {len(orphan_files)} stale cache file(s) — safe to delete",
                     "leftover from previous builds (script hash changed → new cache path). "
                     f"To wipe: rm {' '.join(str(f) for f in orphan_files)}")
        else:
            info("CACHE: ~/.cache/tmux-widget/ does not exist yet",
                 "no cached widgets have run — fresh state")

        # Print summary
        passed = sum(1 for r in results if r[0] == "PASS")
        failed = sum(1 for r in results if r[0] == "FAIL")
        info_ct = sum(1 for r in results if r[0] == "INFO")

        for verdict, name, detail in results:
            print(f"[ {verdict:4} ] {name}")
            if detail and verdict != "PASS":
                print(f"           {detail}")

        print()
        print(f"Summary: {passed} PASS, {failed} FAIL, {info_ct} INFO")
        if failed > 0:
            print(f"\nReference tickets: .context/tasks/todo/2026-05-14T08-*.md")
            sys.exit(0)  # don't fail the whole dump, just report
        PYEOF

        # Echo check summary to stdout so the user sees it inline
        echo
        tail -1 "$DEST/99-checks.txt"

        # ─── stable pointer for Claude to read ─────────────────────────────
        rm -rf "$LATEST"
        cp -R "$DEST" "$LATEST"

        printf '\n✓ dump complete\n  stamped: %s\n  latest:  %s\n\n' "$DEST" "$LATEST"
        ls "$LATEST"

  debug:theme-diff:
    desc: Diff the two most recent theme dumps (e.g. dracula vs current)
    cmds:
      - |
        set -eu
        cd {{.DUMP_ROOT}}
        DUMPS=$(ls -1dt */ 2>/dev/null | grep -v '^latest/$' | head -2)
        N=$(echo "$DUMPS" | wc -l | tr -d ' ')
        if [ "$N" -lt 2 ]; then
          echo "Need at least 2 dumps. Found: $N" >&2
          echo "Run \`task debug:theme\` in each theme state." >&2
          exit 1
        fi
        NEW=$(echo "$DUMPS" | sed -n '1p' | tr -d '/')
        OLD=$(echo "$DUMPS" | sed -n '2p' | tr -d '/')
        echo "Diffing: $OLD  →  $NEW"
        echo
        diff -ru "$OLD" "$NEW" > diff.txt || true
        echo "Wrote {{.DUMP_ROOT}}/diff.txt ($(wc -l < diff.txt) lines)"
        echo
        echo "Key files to look at first:"
        for f in 10-server-options.txt 12-status-slice.txt 13-status-format.txt \
                 30-pane-border-status.txt 31-pane-border-format.txt 33-pane-title.txt \
                 51-keys-root.txt; do
          if ! diff -q "$OLD/$f" "$NEW/$f" >/dev/null 2>&1; then
            echo "  CHANGED: $f"
          fi
        done

  debug:theme-clean:
    desc: Wipe all theme dumps
    cmds:
      - rm -rf {{.DUMP_ROOT}}
      - echo "wiped {{.DUMP_ROOT}}"

  debug:tmuxp:
    desc: 'Dump full tmux + tmuxp state for the current tmux session'
    cmds:
      - |
        set -eu

        # Session = current tmux session (must be run from inside tmux).
        # No knobs — each invocation produces a single timestamped dump
        # directory. Re-run as needed; older dumps stay put for diffing.
        if [ -z "${TMUX:-}" ]; then
          echo "ERROR: not inside tmux — run this from inside the session you want to capture." >&2
          exit 1
        fi
        SESSION=$(tmux display-message -p '#S')

        ROOT={{.ROOT_DIR}}
        STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
        DEST={{.TMUXP_DUMP_ROOT}}/${STAMP}-${SESSION}
        mkdir -p "$DEST"

        # ─── 00-meta: tool versions, git context, tmux client info ─────────
        # Tells future-us (and Claude) what version of every moving part
        # produced this dump.
        {
          echo "session=$SESSION"
          echo "stamp=$STAMP"
          echo "tmux_version=$(tmux -V 2>&1)"
          echo "tmuxp_version=$(tmuxp --version 2>&1 || echo '(tmuxp not found)')"
          echo "tmuxp_path=$(command -v tmuxp 2>&1 || echo '(none)')"
          echo "python_version=$(python3 --version 2>&1)"
          SNAP_PY="$ROOT/home/scripts/tmux/snapshot/snapshot.py"
          echo "snapshot_py=$SNAP_PY"
          if [ -f "$SNAP_PY" ]; then
            echo "snapshot_py_sha=$(sha256sum "$SNAP_PY" 2>/dev/null | head -c 12 || shasum -a 256 "$SNAP_PY" 2>/dev/null | head -c 12)"
          fi
          # TMUX env var is "$socket,$server_pid,$session_id" when inside tmux
          echo "tmux_env=${TMUX:-(outside tmux)}"
          echo "client_width=$(tmux display-message -p -t "$SESSION" '#{client_width}' 2>/dev/null || echo '?')"
          echo "client_height=$(tmux display-message -p -t "$SESSION" '#{client_height}' 2>/dev/null || echo '?')"
          echo "git_head=$(cd "$ROOT" && git rev-parse HEAD 2>/dev/null || echo '?')"
          echo "git_branch=$(cd "$ROOT" && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '?')"
          echo "git_dirty_count=$(cd "$ROOT" && git status --porcelain 2>/dev/null | wc -l | tr -d ' ') files"
          echo "git_dirty_snapshot_py=$(cd "$ROOT" && git status --porcelain home/scripts/tmux/snapshot/ 2>/dev/null | head -5)"
        } > "$DEST/00-meta.txt"

        # ─── 10-server-globals: global @-options (incl. @layout-6..9) ──────
        # snapshot.py persists @layout-6..9 as `custom_layouts`. Anything
        # else in the global @-namespace is invisible to save — capture it
        # so we know what's leaking through.
        {
          echo "# Global @-prefixed options (server-wide via 'set -g')"
          echo "# snapshot.py persists @layout-6..9 only; everything else is dropped."
          echo
          tmux show-options -g 2>/dev/null | grep -E '^@' || echo "(no global @-options set)"
          echo
          echo "# Full global server-option dump (for reference / diffing)"
          echo
          tmux show-options -g 2>/dev/null
        } > "$DEST/10-server-globals.txt"

        # ─── 20-windows: per-window state + ALL window @-options ───────────
        # snapshot.py persists only main-pane-{height,width} (window opts)
        # and the layout string. ANY other @-prefixed window option (set via
        # `set-window-option -t window`) is invisible to save.
        {
          echo "# Window-scope state for session $SESSION"
          echo "# snapshot.py persists: layout, main-pane-{height,width}"
          echo "# snapshot.py drops:    every other window option (@-namespace included)"
          echo
          for wid in $(tmux list-windows -t "$SESSION" -F '#{window_id}'); do
            # Target by window_id (@N) — dotted window names (e.g. "nmd.gg")
            # confuse tmux's `-t session:name` parser.
            wname=$(tmux display-message -p -t "$wid" '#{window_name}')
            wactive=$(tmux display-message -p -t "$wid" '#{window_active}')
            wpanes=$(tmux display-message -p -t "$wid" '#{window_panes}')
            wflags=$(tmux display-message -p -t "$wid" '#{window_flags}')
            wzoomed=$(tmux display-message -p -t "$wid" '#{window_zoomed_flag}')
            echo "== $wname ($wid) =="
            echo "  active=$wactive panes=$wpanes zoomed=$wzoomed flags='$wflags'"
            echo "  layout: $(tmux display-message -p -t "$wid" '#{window_layout}')"
            echo "  visible-layout: $(tmux display-message -p -t "$wid" '#{window_visible_layout}')"
            # main-pane-* (snapshot.py allowlist)
            mph=$(tmux show-window-options -t "$wid" main-pane-height 2>/dev/null || true)
            mpw=$(tmux show-window-options -t "$wid" main-pane-width 2>/dev/null || true)
            [ -n "$mph" ] && echo "  $mph"
            [ -n "$mpw" ] && echo "  $mpw"
            # All @-prefixed window user options (currently dropped on save)
            uopts=$(tmux show-window-options -t "$wid" 2>/dev/null | grep -E '^@' || true)
            if [ -n "$uopts" ]; then
              echo "  window @-options (dropped by snapshot.py):"
              echo "$uopts" | sed 's/^/    /'
            fi
            echo
          done
        } > "$DEST/20-windows.txt"

        # ─── 30-panes: full pane state + ALL pane @-options + env ──────────
        # Per pane: every round-trip-relevant format field, plus a dump of
        # every @-prefixed pane option (catches @label AND anything else
        # snapshot.py misses), plus the relevant env vars (CELL_ID, CELL_TITLE)
        # as read from /proc or `ps -E` — the same channel snapshot.py uses.
        {
          echo "# Pane-scope state for session $SESSION"
          echo "# Key fields per pane:"
          echo "#   idx        - pane_index (tmuxp ordering slot)"
          echo "#   id         - pane_id (server-global, %N)"
          echo "#   pid        - pane_pid (used by snapshot.py to read CELL_ID env)"
          echo "#   top/left   - visual position"
          echo "#   active     - focus flag"
          echo "#   cmd        - pane_current_command (live)"
          echo "#   start_cmd  - pane_start_command (original spawn)"
          echo "#   cwd        - pane_current_path"
          echo "#   @label     - user pane label (DROPPED by snapshot.py)"
          echo "#   title      - pane_title (SAVED by snapshot.py as CELL_TITLE)"
          echo
          for wid in $(tmux list-windows -t "$SESSION" -F '#{window_id}'); do
            wname=$(tmux display-message -p -t "$wid" '#{window_name}')
            echo "== $wname ($wid) =="
            tmux list-panes -t "$wid" -F \
              "idx=#{pane_index} id=#{pane_id} pid=#{pane_pid} top=#{pane_top} left=#{pane_left} active=#{?pane_active,1,0} cmd=#{pane_current_command} start_cmd='#{pane_start_command}' cwd='#{pane_current_path}' @label='#{@label}' title='#{pane_title}'"
            # Per-pane @-namespace dump + initial env (CELL_*)
            for pid in $(tmux list-panes -t "$wid" -F '#{pane_id}'); do
              ppid=$(tmux display-message -p -t "$pid" '#{pane_pid}')
              uopts=$(tmux show-options -p -t "$pid" 2>/dev/null | grep -E '^@' || true)
              if [ -n "$uopts" ]; then
                echo "  $pid @-options (DROPPED by snapshot.py):"
                echo "$uopts" | sed 's/^/    /'
              fi
              # Initial env for the pane process — read CELL_ID and CELL_TITLE
              # the same way snapshot.py does. Linux: /proc/<pid>/environ.
              # macOS/BSD: `ps -E`. Both fail silently if unavailable.
              cell_id=""
              cell_title=""
              if [ -r "/proc/$ppid/environ" ]; then
                cell_id=$(tr '\0' '\n' < "/proc/$ppid/environ" 2>/dev/null | grep '^CELL_ID=' | head -1 | cut -d= -f2- || true)
                cell_title=$(tr '\0' '\n' < "/proc/$ppid/environ" 2>/dev/null | grep '^CELL_TITLE=' | head -1 | cut -d= -f2- || true)
              elif command -v ps >/dev/null 2>&1; then
                envs=$(ps -E -ww -o command= -p "$ppid" 2>/dev/null || true)
                cell_id=$(echo "$envs" | tr ' ' '\n' | grep '^CELL_ID=' | head -1 | cut -d= -f2- || true)
                cell_title=$(echo "$envs" | tr ' ' '\n' | grep '^CELL_TITLE=' | head -1 | cut -d= -f2- || true)
              fi
              if [ -n "$cell_id" ] || [ -n "$cell_title" ]; then
                echo "  $pid env: CELL_ID='$cell_id' CELL_TITLE='$cell_title'"
              fi
            done
            echo
          done
        } > "$DEST/30-panes.txt"

        # ─── 40-saved.yaml: the file snapshot.py last wrote ────────────────
        YAML="$HOME/.config/tmuxp/${SESSION}.yaml"
        if [ -f "$YAML" ]; then
          cp "$YAML" "$DEST/40-saved.yaml"
          # Quick presence-check on what tokens made it into the saved file.
          # Reveals the coverage gap at a glance:
          #   CELL_LABEL=0 → @label round-trip not implemented (current state)
          #   @label=0     → confirms snapshot.py never emits @label in any form
          {
            echo "# Presence check (grep -c) in 40-saved.yaml"
            echo "size=$(wc -c < "$DEST/40-saved.yaml" | tr -d ' ') bytes"
            echo "mtime=$(date -r "$DEST/40-saved.yaml" '+%Y-%m-%dT%H:%M:%S%z' 2>/dev/null || stat -c '%y' "$DEST/40-saved.yaml" 2>/dev/null)"
            echo
            for tok in CELL_ID CELL_TITLE CELL_LABEL @label label preset_layouts custom_layouts main-pane-height main-pane-width focus shell_command environment; do
              count=$(grep -c "$tok" "$DEST/40-saved.yaml" 2>/dev/null || true)
              echo "  $tok: ${count:-0}"
            done
          } > "$DEST/41-saved-summary.txt"
        else
          echo "(no saved YAML at $YAML — run save first)" > "$DEST/40-NO-SAVED-YAML.txt"
        fi

        # ─── 50-snapshot-emit.yaml: what snapshot.py WOULD emit now ────────
        # In-process call to query_session + emit_yaml against the live state.
        # Gives us the "if you saved right now" YAML without waiting for the
        # user to press save. The diff between 40-saved.yaml and 50-snapshot-emit.yaml
        # is what changed between the last save and now (e.g. labels added).
        SNAP_PY="$ROOT/home/scripts/tmux/snapshot/snapshot.py"
        if [ -f "$SNAP_PY" ] && command -v python3 >/dev/null 2>&1; then
          DUMPS_DIR="$DEST" SNAP_PATH="$SNAP_PY" SESSION="$SESSION" \
          OUT="$DEST/50-snapshot-emit.yaml" SNAP_PATH="$SNAP_PY" SESSION="$SESSION" \
            python3 "$ROOT/home/scripts/tmux/snapshot/_debug_emit.py" \
            > "$DEST/50-snapshot-emit.log" 2>&1 || true
        else
          echo "(snapshot.py or python3 not available)" > "$DEST/50-snapshot-emit.log"
        fi

        # ─── 60-snapshot-py.copy: pin the script version with the dump ─────
        # Future-proofing: if the script changes, this dump still shows
        # which version produced 50-snapshot-emit.yaml.
        if [ -f "$SNAP_PY" ]; then
          cp "$SNAP_PY" "$DEST/60-snapshot-py.copy"
        fi

        # ─── inventory ─────────────────────────────────────────────────────
        ls -1 "$DEST"
        printf '\n✓ debug dump at: %s\n' "$DEST"

  # ── QEMU fake-el2 (FEAT_VHE emulation) — macOS-only compile debug ──────
  # Run on the Mac after editing the VHE core/glue. Compiles the C that
  # Linux can't (hvf.c only builds with the Apple SDK) and captures every
  # error into .context/debug/qemu/el2.log for Claude to read back.
  #
  #   task debug:qemu:el2          — run all three, fresh log
  #   task debug:qemu:el2:core     — just the standalone core (fast)
  #   task debug:qemu:el2:replay   — just the replay harness
  #   task debug:qemu:el2:qemu     — just the full QEMU build (the real check)
  #
  # NOTE: the QEMU build reads the flake's git tree — `git add` any new/edited
  # files first or the build won't see them.
  debug:qemu:el2:
    desc: 'macOS: boot Alpine Linux ARM64 with patched QEMU+HVF'
    silent: true
    cmds:
      - |
        set -eu
        mkdir -p "$(dirname '{{.QEMU_EL2_LOG}}')"
        {
          echo "=== debug:qemu:el2 $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          echo "host:  $(uname -srm)"
          echo "macOS: $(sw_vers -productVersion 2>/dev/null || echo N/A)"
          echo "nix:   $(nix --version 2>/dev/null || echo N/A)"
        } > '{{.QEMU_EL2_LOG}}'
      - task: debug:qemu:el2:boot
      - |
        echo
        echo "── el2.log summary ──────────────────────────────────────────"
        grep -E '^\[(boot)\].*VERDICT\|^\[(boot)\].*exit\|^\[(boot)\].*OK\|^\[(boot)\].*FAIL' '{{.QEMU_EL2_LOG}}' || true
        echo
        echo "Full log: {{.QEMU_EL2_LOG}}"

  debug:qemu:el2:core:
    desc: 'macOS: standalone compile + unit-test of vhe_core.c (Apple clang)'
    silent: true
    cmds:
      - |
        set -u
        mkdir -p "$(dirname '{{.QEMU_EL2_LOG}}')"
        LOG='{{.QEMU_EL2_LOG}}'
        VHE='{{.VHE_DIR}}'
        {
          echo
          echo "### [core] standalone vhe_core.c compile + unit tests"
        } >> "$LOG"
        # strict compile of the core (no QEMU deps — pure C)
        cc -std=gnu11 -Wall -Wextra -Werror -pedantic -I"$VHE" \
           -c "$VHE/vhe_core.c" -o /tmp/vhe_core.o >> "$LOG" 2>&1
        cc_rc=$?
        echo "[core] compile exit=$cc_rc" >> "$LOG"
        # build + run the unit suite
        if cc -std=gnu11 -Wall -Wextra -Werror -I"$VHE" \
              -o /tmp/test_vhe_core "$VHE/test_vhe_core.c" "$VHE/vhe_core.c" >> "$LOG" 2>&1; then
          /tmp/test_vhe_core >> "$LOG" 2>&1
          echo "[core] tests exit=$?" >> "$LOG"
        else
          echo "[core] test build FAILED (see log)" >> "$LOG"
        fi
        tail -1 "$LOG"

  debug:qemu:el2:replay:
    desc: 'macOS: compile vhe_replay.c + run the replay harness tests'
    silent: true
    cmds:
      - |
        set -u
        mkdir -p "$(dirname '{{.QEMU_EL2_LOG}}')"
        LOG='{{.QEMU_EL2_LOG}}'
        VHE='{{.VHE_DIR}}'
        {
          echo
          echo "### [replay] vhe_replay.c compile + harness tests"
        } >> "$LOG"
        cc -std=gnu11 -Wall -Wextra -Werror -I"$VHE" \
           -o /tmp/vhe_replay "$VHE/vhe_replay.c" "$VHE/vhe_core.c" >> "$LOG" 2>&1
        echo "[replay] compile exit=$?" >> "$LOG"
        if command -v python3 >/dev/null 2>&1; then
          ( cd "$VHE" && python3 test_replay_sysreg_trace.py ) >> "$LOG" 2>&1
          echo "[replay] harness tests exit=$?" >> "$LOG"
        else
          echo "[replay] python3 not found — skipped harness tests" >> "$LOG"
        fi
        tail -1 "$LOG"

  debug:qemu:el2:qemu:
    desc: 'macOS: compile ONLY hvf.c + vhe_core.c against real QEMU+HVF headers'
    silent: true
    cmds:
      - |
        set -u
        mkdir -p "$(dirname '{{.QEMU_EL2_LOG}}')"
        LOG='{{.QEMU_EL2_LOG}}'
        {
          echo
          echo "### [qemu] surgical compile-check — hvf.c + vhe_core.c only"
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> "$LOG"
        NIX_EXPR='
          let
            flake = builtins.getFlake "git+file://{{.ROOT_DIR}}";
            system = builtins.currentSystem;
            pkgs = import flake.inputs.nixpkgs { inherit system; };
            pkgsEdge = import flake.inputs.nixpkgs-edge { inherit system; };
          in import {{.ROOT_DIR}}/home/dmitry/packages/qemu-hvf-compilecheck.nix { inherit pkgs pkgsEdge; }
        '
        rc=0
        nix build --impure -L --no-link --print-out-paths \
          --expr "$NIX_EXPR" >> "$LOG" 2>&1 || rc=$?
        if [ "$rc" -ne 0 ]; then
          echo "[qemu] compile-check exit=$rc" >> "$LOG"
          echo "" >> "$LOG"
          echo "### [qemu] nix log (full build output):" >> "$LOG"
          DRV=$(nix path-info --impure --derivation --expr "$NIX_EXPR" 2>/dev/null || true)
          if [ -n "$DRV" ]; then
            nix log "$DRV" >> "$LOG" 2>&1 || echo "(nix log failed for $DRV)" >> "$LOG"
          else
            echo "(could not resolve derivation path)" >> "$LOG"
          fi
          echo "" >> "$LOG"
          echo "### [qemu] compiler errors (grep):" >> "$LOG"
          grep -E '(error:|warning:|undefined|undeclared|fatal)' "$LOG" | tail -30 >> "$LOG" 2>/dev/null || true
          echo "[qemu] COMPILE FAILED — see $LOG" | tee -a "$LOG"
          exit 1
        else
          echo "[qemu] compile-check exit=0" >> "$LOG"
          echo "[qemu] hvf.c + vhe_core.c compiled OK" | tee -a "$LOG"
        fi

  debug:qemu:el2:fullbuild:
    desc: 'macOS: full QEMU build with VHE patches — produces qemu-system-aarch64'
    silent: true
    cmds:
      - |
        set -u
        LOG='{{.QEMU_EL2_LOG}}'
        {
          echo
          echo "### [fullbuild] full patched QEMU (qemu-rc.nix)"
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> "$LOG"
        NIX_EXPR='
          let
            flake = builtins.getFlake "git+file://{{.ROOT_DIR}}";
            system = builtins.currentSystem;
            pkgs = import flake.inputs.nixpkgs { inherit system; };
            pkgsEdge = import flake.inputs.nixpkgs-edge { inherit system; };
          in import {{.ROOT_DIR}}/home/dmitry/packages/qemu-rc.nix { inherit pkgs pkgsEdge; }
        '
        rc=0
        nix build --impure -L --no-link --print-out-paths \
          --expr "$NIX_EXPR" >> "$LOG" 2>&1 || rc=$?
        if [ "$rc" -ne 0 ]; then
          echo "[fullbuild] exit=$rc" >> "$LOG"
          DRV=$(nix path-info --impure --derivation --expr "$NIX_EXPR" 2>/dev/null || true)
          if [ -n "$DRV" ]; then
            echo "### [fullbuild] nix log:" >> "$LOG"
            nix log "$DRV" >> "$LOG" 2>&1 || true
          fi
          echo "[fullbuild] FULL BUILD FAILED — see $LOG" | tee -a "$LOG"
          exit 1
        else
          OUT=$(nix build --impure --no-link --print-out-paths --expr "$NIX_EXPR" 2>/dev/null | head -1)
          BINARY="$OUT/bin/qemu-system-aarch64"
          if [ -x "$BINARY" ]; then
            echo "[fullbuild] exit=0" >> "$LOG"
            echo "[fullbuild] binary: $BINARY" >> "$LOG"
            "$BINARY" --version >> "$LOG" 2>&1 || true
            echo "[fullbuild] qemu-system-aarch64 built OK" | tee -a "$LOG"
          else
            echo "[fullbuild] exit=0 but binary not found at $BINARY" >> "$LOG"
            echo "[fullbuild] store path: $OUT" >> "$LOG"
            ls "$OUT/bin/" >> "$LOG" 2>&1 || true
            echo "[fullbuild] WARNING — binary missing, see $LOG" | tee -a "$LOG"
          fi
        fi

  debug:qemu:el2:boot:
    desc: 'macOS: boot Alpine Linux ARM64 with HVF — smoke-test the built binary'
    silent: true
    cmds:
      - |
        set -u
        LOG='{{.QEMU_EL2_LOG}}'
        trap 'echo "[boot] script exited unexpectedly at line $LINENO (exit=$?)" >> "$LOG" 2>/dev/null || true' EXIT
        CACHE="{{.ROOT_DIR}}/.context/debug/qemu/cache"
        ALPINE_VER="3.21.3"
        ALPINE_MINOR="3.21"
        SERIAL_OUT="$CACHE/serial.log"
        {
          echo
          echo "### [boot] Alpine Linux ARM64 — HVF + fake-el2=on (VHE emulation)"
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> "$LOG"

        # resolve QEMU from nix store — bypass eval cache (H1) so patch changes
        # are picked up immediately after editing.
        NIX_EXPR='
          let
            flake = builtins.getFlake "git+file://{{.ROOT_DIR}}";
            system = builtins.currentSystem;
            pkgs = import flake.inputs.nixpkgs { inherit system; };
            pkgsEdge = import flake.inputs.nixpkgs-edge { inherit system; };
          in import {{.ROOT_DIR}}/home/dmitry/packages/qemu-rc.nix { inherit pkgs pkgsEdge; }
        '
        echo "[boot] building QEMU (--no-eval-cache to pick up patch changes)..." >> "$LOG"
        QEMU_OUT=$(nix build --impure --no-eval-cache --no-link --print-out-paths --expr "$NIX_EXPR" 2>> "$LOG" | head -1)
        if [ -z "$QEMU_OUT" ] || [ ! -d "$QEMU_OUT" ]; then
          echo "[boot] BUILD FAILED — nix build returned empty or missing path" >> "$LOG"
          echo "[boot] BUILD FAILED — see $LOG for compiler errors" | tee -a "$LOG"
          trap - EXIT
          exit 1
        fi
        QEMU="$QEMU_OUT/bin/qemu-system-aarch64"
        echo "[boot] qemu: $QEMU" >> "$LOG"
        echo "[boot] store path: $QEMU_OUT" >> "$LOG"

        # download Alpine kernel + initramfs + ISO for direct kernel boot
        mkdir -p "$CACHE"
        KERNEL="$CACHE/vmlinuz-virt-${ALPINE_VER}"
        INITRD="$CACHE/initramfs-virt-${ALPINE_VER}"
        ISO="$CACHE/alpine-virt-${ALPINE_VER}-aarch64.iso"
        BASE_URL="https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_MINOR}/releases/aarch64"
        for asset in netboot/vmlinuz-virt netboot/initramfs-virt; do
          FNAME=$(basename "$asset")
          LOCAL="$CACHE/${FNAME}-${ALPINE_VER}"
          if [ ! -f "$LOCAL" ]; then
            echo "[boot] downloading $BASE_URL/$asset" | tee -a "$LOG"
            curl -fSL -o "$LOCAL.tmp" "$BASE_URL/$asset" >> "$LOG" 2>&1
            mv "$LOCAL.tmp" "$LOCAL"
          fi
        done
        if [ ! -f "$ISO" ]; then
          echo "[boot] downloading ISO" | tee -a "$LOG"
          curl -fSL -o "$ISO.tmp" "$BASE_URL/alpine-virt-${ALPINE_VER}-aarch64.iso" >> "$LOG" 2>&1
          mv "$ISO.tmp" "$ISO"
        fi
        echo "[boot] kernel:  $KERNEL ($(du -h "$KERNEL" | cut -f1))" >> "$LOG"
        echo "[boot] initrd:  $INITRD ($(du -h "$INITRD" | cut -f1))" >> "$LOG"
        echo "[boot] iso:     $ISO ($(du -h "$ISO" | cut -f1))" >> "$LOG"

        # boot with HVF + fake-el2, direct kernel (bypasses UEFI), ISO as root media
        # loglevel=7: capture all kernel messages including CPU feature detection (H1)
        # -cdrom: provide boot media so initramfs can mount rootfs (H2)
        # QEMU_HVF_SYSREG_TRACE: capture sysreg traps to check if ID regs trap (H3)
        SYSREG_TRACE="$CACHE/sysreg-trace.jsonl"
        echo "[boot] booting Alpine (timeout 45s)..." | tee -a "$LOG"
        rm -f "$SERIAL_OUT" "$SYSREG_TRACE"
        QEMU_RC=0
        QEMU_HVF_SYSREG_TRACE="$SYSREG_TRACE" \
        timeout 45 "$QEMU" \
          -machine virt,virtualization=on \
          -accel hvf,fake-el2=on \
          -cpu host \
          -m 512 \
          -display none \
          -kernel "$KERNEL" \
          -initrd "$INITRD" \
          -append "console=ttyAMA0 loglevel=7" \
          -cdrom "$ISO" \
          -serial file:"$SERIAL_OUT" \
          -monitor none \
          -no-reboot \
          >> "$LOG" 2>&1 || QEMU_RC=$?
        echo "[boot] qemu exit=$QEMU_RC (124=timeout, 0=clean)" >> "$LOG"

        # H1/H2: check VHE diagnostic output (fprintf to stderr, captured in LOG)
        if grep -q '\[VHE-DIAG\]' "$LOG"; then
          VHE_DIAG_COUNT=$(grep -c '\[VHE-DIAG\]' "$LOG" || echo 0)
          echo "[boot] VHE diagnostic lines: $VHE_DIAG_COUNT found in QEMU stderr" >> "$LOG"
          grep '\[VHE-DIAG\]' "$LOG" | sed 's/^/  /' >> "$LOG"
        else
          echo "[boot] WARNING: no [VHE-DIAG] lines — patch may not have compiled in" >> "$LOG"
        fi

        # H3: check TID3 trap activity (ID register reads now handled in our handler)
        TID3_SET=$(grep -c '\[VHE-DIAG\] HCR_EL2 set TID3' "$LOG" 2>/dev/null || true)
        TID3_TRAPS=$(grep -c '\[VHE-DIAG\] TID3 trap:' "$LOG" 2>/dev/null || true)
        echo "[boot] TID3: set=$TID3_SET trap_count=$TID3_TRAPS" >> "$LOG"
        if [ "$TID3_TRAPS" -gt 0 ]; then
          echo "[boot] TID3 traps active — ID register reads routing through QEMU" >> "$LOG"
          grep '\[VHE-DIAG\] TID3 trap:' "$LOG" | head -5 >> "$LOG" 2>/dev/null || true
        fi
        if [ -f "$SYSREG_TRACE" ]; then
          TRACE_LINES=$(wc -l < "$SYSREG_TRACE" | tr -d ' ')
          echo "[boot] sysreg trace: $TRACE_LINES entries in $SYSREG_TRACE" >> "$LOG"
        else
          echo "[boot] sysreg trace: file not created (trace patch not active?)" >> "$LOG"
        fi

        # check serial output
        if [ ! -f "$SERIAL_OUT" ]; then
          echo "[boot] no serial output captured" >> "$LOG"
          echo "[boot] BOOT FAILED — no serial output" | tee -a "$LOG"
          exit 1
        fi
        LINES=$(wc -l < "$SERIAL_OUT" | tr -d ' ')
        echo "[boot] serial output: $LINES lines" >> "$LOG"
        cat "$SERIAL_OUT" >> "$LOG"

        # boot check
        if grep -qi 'login:\|Welcome to Alpine\|Linux version' "$SERIAL_OUT"; then
          echo "[boot] Alpine kernel booted" >> "$LOG"
        elif grep -qi 'kernel\|Booting\|EFI stub' "$SERIAL_OUT"; then
          echo "[boot] PARTIAL — kernel started, no login prompt in 45s" | tee -a "$LOG"
        else
          echo "[boot] no boot markers in serial output" >> "$LOG"
          echo "[boot] BOOT FAILED — see $LOG" | tee -a "$LOG"
          exit 1
        fi

        # VHE litmus: does the guest see FEAT_VHE?
        if grep -q 'Virtualization Host Extensions' "$SERIAL_OUT"; then
          echo "[boot] VERDICT: VHE — guest sees FEAT_VHE" | tee -a "$LOG"
        elif grep -q 'nVHE\|Hyp nVHE' "$SERIAL_OUT"; then
          echo "[boot] VERDICT: nVHE — guest does NOT see FEAT_VHE" | tee -a "$LOG"
        elif grep -qi 'started at EL' "$SERIAL_OUT"; then
          EL_LINE=$(grep -i 'started at EL' "$SERIAL_OUT" | head -1)
          echo "[boot] EL info: $EL_LINE" >> "$LOG"
          if grep -q 'VHE mode' "$SERIAL_OUT"; then
            echo "[boot] VERDICT: VHE" | tee -a "$LOG"
          else
            echo "[boot] VERDICT: nVHE (no VHE mode line)" | tee -a "$LOG"
          fi
        else
          echo "[boot] VERDICT: UNKNOWN — no VHE/nVHE markers in dmesg" | tee -a "$LOG"
        fi
        trap - EXIT

  debug:qemu:el2:trace:
    desc: 'macOS: replay real sysreg trace through VHE core, report unhandled regs'
    silent: true
    cmds:
      - |
        set -u
        mkdir -p "$(dirname '{{.QEMU_EL2_LOG}}')"
        LOG='{{.QEMU_EL2_LOG}}'
        VHE='{{.VHE_DIR}}'
        TRACE_DIR="{{.ROOT_DIR}}/.context/debug/qemu"
        TRACE_FILE="$TRACE_DIR/sysreg-trace.jsonl"
        FIXTURE_FILE="$TRACE_DIR/windows-boot.fixture"
        {
          echo
          echo "### [trace] sysreg trace capture + replay analysis"
        } >> "$LOG"

        if [ ! -f "$TRACE_FILE" ]; then
          {
            echo "[trace] no trace file at $TRACE_FILE"
            echo "[trace] Boot a Windows guest with tracing enabled:"
            echo "[trace]   QEMU_HVF_SYSREG_TRACE=$TRACE_FILE \\"
            echo "[trace]     qemu-system-aarch64 -machine virt,virtualization=on -accel hvf,fake-el2=on ..."
            echo "[trace] SKIP — capture trace first"
          } >> "$LOG"
          tail -1 "$LOG"
          exit 0
        fi

        LINES=$(wc -l < "$TRACE_FILE" | tr -d ' ')
        echo "[trace] trace file: $LINES lines" >> "$LOG"

        # parse trace into replay fixture
        python3 "{{.ROOT_DIR}}/home/scripts/qemu/parse_sysreg_trace.py" \
          < "$TRACE_FILE" > "$FIXTURE_FILE" 2>> "$LOG"
        echo "[trace] fixture: $(wc -l < "$FIXTURE_FILE" | tr -d ' ') lines → $FIXTURE_FILE" >> "$LOG"

        # replay through VHE core (binary built by debug:qemu:el2:replay)
        if [ ! -x /tmp/vhe_replay ]; then
          echo "[trace] /tmp/vhe_replay not found — run debug:qemu:el2:replay first" >> "$LOG"
          tail -1 "$LOG"
          exit 1
        fi
        /tmp/vhe_replay < "$FIXTURE_FILE" >> "$LOG" 2>&1
        rc=$?
        echo "[trace] replay exit=$rc" >> "$LOG"
        if [ "$rc" -ne 0 ]; then
          echo "[trace] UNHANDLED SYSREGS — work queue:" >> "$LOG"
          grep -i "unhandled\|unknown" "$LOG" | tail -20 >> "$LOG" 2>/dev/null || true
        fi
        tail -1 "$LOG"
